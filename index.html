<title>総合指数ボード</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;600;800&family=Noto+Sans+JP:wght@400;500;600;700&display=swap');

  :root{
    --paper:#F5F1E6;
    --surface:#FFFFFF;
    --surface-2:#FBF8EF;
    --ink:#1C2420;
    --ink-muted:#63695D;
    --ink-faint:#8B8F80;
    --turf:#2E6B4C;
    --turf-deep:#1E4A34;
    --turf-tint:rgba(46,107,76,.10);
    --gold:#B3812E;
    --gold-tint:rgba(179,129,46,.14);
    --silver:#7A7F72;
    --bronze:#9C6B3E;
    --line:#DED5BD;
    --line-soft:#E9E2CE;
    --positive:#2E7D4F;
    --positive-bg:rgba(46,125,79,.12);
    --negative:#B0453C;
    --negative-bg:rgba(176,69,60,.12);
    --shadow: 0 1px 2px rgba(28,36,32,.05), 0 8px 24px -12px rgba(28,36,32,.18);
    --radius-lg: 18px;
    --radius-md: 12px;
    --radius-sm: 8px;
  }

  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --paper:#12160F;
      --surface:#1A1F16;
      --surface-2:#1F251A;
      --ink:#ECE7D6;
      --ink-muted:#A3A594;
      --ink-faint:#767A6A;
      --turf:#6FBF92;
      --turf-deep:#4E9A72;
      --turf-tint:rgba(111,191,146,.12);
      --gold:#E0B15C;
      --gold-tint:rgba(224,177,92,.14);
      --silver:#9A9D8E;
      --bronze:#C08A56;
      --line:#2B3025;
      --line-soft:#232820;
      --positive:#6FBF92;
      --positive-bg:rgba(111,191,146,.14);
      --negative:#E28B80;
      --negative-bg:rgba(226,139,128,.14);
      --shadow: 0 1px 2px rgba(0,0,0,.25), 0 12px 28px -14px rgba(0,0,0,.55);
    }
  }
  :root[data-theme="dark"]{
    --paper:#12160F;
    --surface:#1A1F16;
    --surface-2:#1F251A;
    --ink:#ECE7D6;
    --ink-muted:#A3A594;
    --ink-faint:#767A6A;
    --turf:#6FBF92;
    --turf-deep:#4E9A72;
    --turf-tint:rgba(111,191,146,.12);
    --gold:#E0B15C;
    --gold-tint:rgba(224,177,92,.14);
    --silver:#9A9D8E;
    --bronze:#C08A56;
    --line:#2B3025;
    --line-soft:#232820;
    --positive:#6FBF92;
    --positive-bg:rgba(111,191,146,.14);
    --negative:#E28B80;
    --negative-bg:rgba(226,139,128,.14);
    --shadow: 0 1px 2px rgba(0,0,0,.25), 0 12px 28px -14px rgba(0,0,0,.55);
  }

  *{box-sizing:border-box;}
  html{color-scheme:light dark;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:'Noto Sans JP',"Hiragino Sans","Hiragino Kaku Gothic ProN",sans-serif;
    padding-inline:20px;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3{margin:0; text-wrap:balance;}
  .serif{font-family:'Shippori Mincho', serif;}
  .tnum{font-variant-numeric:tabular-nums; font-feature-settings:"tnum" 1;}
  a{color:inherit;}

  /* ---- top bar ---- */
  .topbar{
    position:sticky; top:0; z-index:30;
    display:flex; align-items:center; gap:16px; flex-wrap:wrap;
    padding-block:16px;
    background:color-mix(in srgb, var(--paper) 92%, transparent);
    backdrop-filter:blur(8px);
    border-bottom:1px solid var(--line);
    margin-inline:-20px; padding-inline:20px;
  }
  .brand{display:flex; align-items:baseline; gap:10px; margin-right:auto;}
  .brand .mark{
    width:30px; height:30px; border-radius:50%;
    background:conic-gradient(from -40deg, var(--turf), var(--turf-deep) 55%, var(--turf) 100%);
    display:flex; align-items:center; justify-content:center;
    color:var(--surface); font-size:13px; font-weight:800; flex:none;
  }
  .brand h1{font-size:19px; font-weight:700; letter-spacing:.02em;}
  .brand .updated{font-size:11.5px; color:var(--ink-faint);}
  .tabs{display:flex; gap:6px; background:var(--surface-2); padding:4px; border-radius:999px; border:1px solid var(--line-soft);}
  .tab{
    appearance:none; border:none; background:transparent; cursor:pointer;
    padding:7px 15px; border-radius:999px; font-size:13.5px; font-weight:600;
    color:var(--ink-muted); font-family:inherit;
  }
  .tab[aria-pressed="true"]{background:var(--turf); color:#fff;}
  .tab:not([aria-pressed="true"]):hover{color:var(--ink);}

  /* ---- intro ---- */
  .intro{
    max-width:760px; margin:22px 0 8px; padding:16px 18px;
    background:var(--surface); border:1px solid var(--line-soft); border-radius:var(--radius-md);
    font-size:13.5px; line-height:1.75; color:var(--ink-muted);
  }
  .intro b{color:var(--ink); font-weight:600;}
  .intro .term{color:var(--turf-deep); font-weight:600;}
  :root[data-theme="dark"] .intro .term, @media (prefers-color-scheme:dark){.intro .term{color:var(--turf);}}

  /* ---- pickup strip ---- */
  .section-label{
    font-size:12px; font-weight:700; letter-spacing:.12em; color:var(--ink-faint);
    text-transform:uppercase; margin:30px 0 10px;
  }
  .pickup-row{
    display:flex; gap:10px; overflow-x:auto; padding-bottom:6px; scroll-snap-type:x proximity;
  }
  .pickup-card{
    scroll-snap-align:start; flex:none; width:168px;
    background:var(--surface); border:1px solid var(--line-soft); border-radius:var(--radius-md);
    padding:12px 13px; box-shadow:var(--shadow); text-decoration:none; color:inherit;
    display:flex; flex-direction:column; gap:6px;
  }
  .pickup-card:hover{border-color:var(--turf);}
  .pickup-meta{font-size:11px; color:var(--ink-faint); display:flex; justify-content:space-between;}
  .pickup-horse{font-size:14.5px; font-weight:700; line-height:1.3;}
  .pickup-score{display:flex; align-items:baseline; gap:4px;}
  .pickup-score .v{font-size:20px; font-weight:800; color:var(--turf-deep);}
  :root[data-theme="dark"] .pickup-score .v{color:var(--turf);}
  @media (prefers-color-scheme:dark){.pickup-score .v{color:var(--turf);}}
  .pickup-score .u{font-size:10.5px; color:var(--ink-faint);}

  /* ---- track group ---- */
  .track-heading{
    display:flex; align-items:center; gap:10px; margin:34px 0 14px;
  }
  .track-heading h2{font-size:22px; font-weight:600;}
  .track-heading .count{font-size:12px; color:var(--ink-faint); background:var(--surface-2); border:1px solid var(--line-soft); padding:3px 10px; border-radius:999px;}
  .track-heading .rule{flex:1; height:1px; background:var(--line);}

  .race-grid{
    display:grid; grid-template-columns:repeat(auto-fill, minmax(380px,1fr)); gap:16px;
    margin-bottom:8px;
  }

  .race-card{
    background:var(--surface); border:1px solid var(--line-soft); border-radius:var(--radius-lg);
    box-shadow:var(--shadow); overflow:hidden; scroll-margin-top:90px;
  }
  .race-card-head{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    padding:13px 16px; border-bottom:1px solid var(--line-soft); background:var(--surface-2);
  }
  .race-card-head .no{font-size:16.5px; font-weight:700;}
  .race-card-head .cnt{font-size:11.5px; color:var(--ink-faint);}

  .race-table-wrap{overflow-x:auto;}
  table.horses{border-collapse:collapse; width:100%; min-width:560px; font-size:12.5px;}
  table.horses th{
    text-align:left; font-weight:600; color:var(--ink-faint); font-size:10.5px;
    letter-spacing:.05em; padding:8px 9px; border-bottom:1px solid var(--line-soft);
    white-space:nowrap; position:sticky; top:0; background:var(--surface);
  }
  table.horses td{padding:8px 9px; border-bottom:1px solid var(--line-soft); vertical-align:middle; white-space:nowrap;}
  table.horses tbody tr:last-child td{border-bottom:none;}
  table.horses tbody tr:hover{background:var(--turf-tint);}

  .rank-badge{
    display:inline-flex; align-items:center; justify-content:center;
    width:22px; height:22px; border-radius:50%; font-size:11px; font-weight:800;
    background:var(--surface-2); color:var(--ink-muted); border:1px solid var(--line-soft);
  }
  .rank-badge.r1{background:var(--gold-tint); color:var(--gold); border-color:transparent;}
  .rank-badge.r2{background:var(--line-soft); color:var(--silver); border-color:transparent;}
  .rank-badge.r3{background:var(--gold-tint); color:var(--bronze); border-color:transparent; opacity:.85;}

  .horse-num{
    display:inline-flex; align-items:center; justify-content:center;
    min-width:20px; height:20px; padding-inline:3px; border-radius:5px;
    background:var(--surface-2); border:1px solid var(--line-soft); font-size:11px; font-weight:700;
  }
  .horse-name{font-weight:600;}
  .score-cell{display:flex; align-items:center; gap:7px; min-width:110px;}
  .score-num{font-weight:800; font-size:13px; width:34px; text-align:right;}
  .score-bar{flex:1; height:6px; border-radius:3px; background:var(--line-soft); min-width:48px; overflow:hidden;}
  .score-bar i{display:block; height:100%; border-radius:3px; background:linear-gradient(90deg, var(--turf-deep), var(--turf));}

  .prob{color:var(--ink-muted);}
  .ev{
    display:inline-flex; align-items:center; gap:2px; font-weight:700; font-size:11.5px;
    padding:2px 7px; border-radius:6px;
  }
  .ev.pos{color:var(--positive); background:var(--positive-bg);}
  .ev.neg{color:var(--negative); background:var(--negative-bg);}
  .odds{color:var(--ink-faint); font-size:11.5px;}

  .col-group-label{font-size:9.5px; font-weight:700; letter-spacing:.06em; color:var(--ink-faint);}

  footer{
    margin:50px -20px 0; padding:22px 20px 34px; border-top:1px solid var(--line);
    font-size:11.5px; color:var(--ink-faint); text-align:center;
  }

  @media (max-width:480px){
    .brand h1{font-size:16.5px;}
    .race-grid{grid-template-columns:1fr;}
    .pickup-card{width:148px;}
  }
</style>

<div class="topbar">
  <div class="brand">
    <span class="mark serif">指</span>
    <div>
      <h1 class="serif">総合指数ボード</h1>
      <div class="updated tnum" id="updatedLabel"></div>
    </div>
  </div>
  <div class="tabs" id="trackTabs" role="tablist" aria-label="競馬場で絞り込み"></div>
</div>

<p class="intro">
  <b>keiba-ai</b> が算出した <span class="term">総合指数</span>(勝率・複勝率・期待値を統合したランキング指数)を、レースごとに指数順で掲載しています。各馬の行には単勝・複勝それぞれの予測確率、オッズ、期待値(EV)を並べ、EVがプラスの馬は緑、マイナスは赤のバッジで示しています。
</p>

<div id="trackGroups"></div>

<script>
(function(){
  const races = JSON.parse(document.getElementById('race-data').textContent);

  function fmtDate(d){
    return d.slice(0,4) + '年' + parseInt(d.slice(4,6)) + '月' + parseInt(d.slice(6,8)) + '日';
  }
  const dateLabel = fmtDate(races[0].date);
  document.getElementById('updatedLabel').textContent = dateLabel + ' 分のレースを掲載';
  document.getElementById('footDate').textContent = dateLabel;

  // global score range for bar scaling
  let scoreMin = Infinity, scoreMax = -Infinity;
  races.forEach(r => r.horses.forEach(h => {
    if (h.score < scoreMin) scoreMin = h.score;
    if (h.score > scoreMax) scoreMax = h.score;
  }));
  const scoreRange = Math.max(1, scoreMax - scoreMin);

  function pct(x){ return (x*100).toFixed(1) + '%'; }
  function evBadge(v){
    const cls = v >= 0 ? 'pos' : 'neg';
    const sign = v >= 0 ? '+' : '';
    return `<span class="ev ${cls} tnum">${sign}${v.toFixed(2)}</span>`;
  }
  function rankBadgeClass(rank){
    if (rank === 1) return 'rank-badge r1';
    if (rank === 2) return 'rank-badge r2';
    if (rank === 3) return 'rank-badge r3';
    return 'rank-badge';
  }

  // group by track, preserving input order
  const trackOrder = [];
  const byTrack = {};
  races.forEach(r => {
    if (!byTrack[r.track]) { byTrack[r.track] = []; trackOrder.push(r.track); }
    byTrack[r.track].push(r);
  });

  // tabs
  const tabsEl = document.getElementById('trackTabs');
  const allBtn = document.createElement('button');
  allBtn.className = 'tab'; allBtn.textContent = 'すべて'; allBtn.setAttribute('aria-pressed','true');
  allBtn.addEventListener('click', () => setFilter(null));
  tabsEl.appendChild(allBtn);
  trackOrder.forEach(t => {
    const b = document.createElement('button');
    b.className = 'tab'; b.textContent = t; b.setAttribute('aria-pressed','false');
    b.addEventListener('click', () => setFilter(t));
    tabsEl.appendChild(b);
  });
  function setFilter(track){
    [...tabsEl.children].forEach(b => b.setAttribute('aria-pressed', String(b.textContent === (track || 'すべて'))));
    document.querySelectorAll('.track-group').forEach(el => {
      el.style.display = (!track || el.dataset.track === track) ? '' : 'none';
    });
  }

  // pickup strip (rank 1 of every race, in order)
  const pickupRow = document.getElementById('pickupRow');
  races.forEach(r => {
    const top = r.horses.find(h => h.rank === 1);
    if (!top) return;
    const a = document.createElement('a');
    a.className = 'pickup-card';
    a.href = '#' + r.raceId;
    a.innerHTML = `
      <div class="pickup-meta"><span>${r.track} ${r.raceNo}R</span><span>${top.num}番</span></div>
      <div class="pickup-horse">${top.name}</div>
      <div class="pickup-score"><span class="v tnum">${top.score.toFixed(1)}</span><span class="u">指数</span></div>
    `;
    pickupRow.appendChild(a);
  });

  // main groups
  const groupsEl = document.getElementById('trackGroups');
  trackOrder.forEach(track => {
    const list = byTrack[track];
    const groupWrap = document.createElement('section');
    groupWrap.className = 'track-group';
    groupWrap.dataset.track = track;

    const heading = document.createElement('div');
    heading.className = 'track-heading';
    heading.innerHTML = `<h2 class="serif">${track}</h2><span class="count">${list.length}レース</span><div class="rule"></div>`;
    groupWrap.appendChild(heading);

    const grid = document.createElement('div');
    grid.className = 'race-grid';

    list.forEach(r => {
      const card = document.createElement('article');
      card.className = 'race-card';
      card.id = r.raceId;

      const rowsHtml = r.horses.map(h => {
        const barPct = ((h.score - scoreMin) / scoreRange * 100).toFixed(0);
        return `
          <tr>
            <td><span class="${rankBadgeClass(h.rank)} tnum">${h.rank}</span></td>
            <td><span class="horse-num tnum">${h.num}</span></td>
            <td class="horse-name">${h.name}</td>
            <td><div class="score-cell"><span class="score-num tnum">${h.score.toFixed(1)}</span><span class="score-bar"><i style="width:${barPct}%"></i></span></div></td>
            <td class="prob tnum">${pct(h.winProb)}</td>
            <td class="odds tnum">${h.winOdds.toFixed(1)}倍</td>
            <td>${evBadge(h.evWin)}</td>
            <td class="prob tnum">${pct(h.placeProb)}</td>
            <td class="odds tnum">${h.placeOdds.toFixed(1)}倍</td>
            <td>${evBadge(h.evPlace)}</td>
          </tr>`;
      }).join('');

      card.innerHTML = `
        <div class="race-card-head">
          <span class="no serif">${track} ${r.raceNo}R</span>
          <span class="cnt">${r.horses.length}頭立て</span>
        </div>
        <div class="race-table-wrap">
          <table class="horses">
            <thead>
              <tr>
                <th>順</th><th>馬番</th><th>馬名</th><th>指数</th>
                <th colspan="3" class="col-group-label">単勝(確率/オッズ/EV)</th>
                <th colspan="3" class="col-group-label">複勝(確率/オッズ/EV)</th>
              </tr>
            </thead>
            <tbody>${rowsHtml}</tbody>
          </table>
        </div>`;
      grid.appendChild(card);
    });

    groupWrap.appendChild(grid);
    groupsEl.appendChild(groupWrap);
  });
})();
</script>
