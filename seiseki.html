<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>成績 | 総合指数ボード</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;600;800&family=Noto+Sans+JP:wght@400;500;600;700&display=swap');

  :root{
    --paper:#F5F1E6;
    --surface:#FFFFFF;
    --surface-2:#FBF8EF;
    --ink:#1C2420;
    --ink-muted:#63695D;
    --ink-faint:#8B8F80;
    --turf:#2E6B4C;
    --turf-deep:#1E4A34;
    --turf-tint:rgba(46,107,76,.10);
    --gold:#B3812E;
    --gold-tint:rgba(179,129,46,.14);
    --line:#DED5BD;
    --line-soft:#E9E2CE;
    --positive:#2E7D4F;
    --negative:#B0453C;
    --shadow: 0 1px 2px rgba(28,36,32,.05), 0 8px 24px -12px rgba(28,36,32,.18);
    --radius-lg: 18px;
    --radius-md: 12px;
    --radius-sm: 8px;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --paper:#12160F; --surface:#1A1F16; --surface-2:#1F251A;
      --ink:#ECE7D6; --ink-muted:#A3A594; --ink-faint:#767A6A;
      --turf:#6FBF92; --turf-deep:#4E9A72; --turf-tint:rgba(111,191,146,.12);
      --gold:#E0B15C; --gold-tint:rgba(224,177,92,.14);
      --line:#2B3025; --line-soft:#232820;
      --positive:#6FBF92; --negative:#E28B80;
      --shadow: 0 1px 2px rgba(0,0,0,.25), 0 12px 28px -14px rgba(0,0,0,.55);
    }
  }
  :root[data-theme="dark"]{
    --paper:#12160F; --surface:#1A1F16; --surface-2:#1F251A;
    --ink:#ECE7D6; --ink-muted:#A3A594; --ink-faint:#767A6A;
    --turf:#6FBF92; --turf-deep:#4E9A72; --turf-tint:rgba(111,191,146,.12);
    --gold:#E0B15C; --gold-tint:rgba(224,177,92,.14);
    --line:#2B3025; --line-soft:#232820;
    --positive:#6FBF92; --negative:#E28B80;
    --shadow: 0 1px 2px rgba(0,0,0,.25), 0 12px 28px -14px rgba(0,0,0,.55);
  }

  *{box-sizing:border-box;}
  html{color-scheme:light dark;}
  body{
    margin:0; background:var(--paper); color:var(--ink);
    font-family:'Noto Sans JP',"Hiragino Sans","Hiragino Kaku Gothic ProN",sans-serif;
    padding-inline:20px; -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3{margin:0; text-wrap:balance;}
  .serif{font-family:'Shippori Mincho', serif;}
  .tnum{font-variant-numeric:tabular-nums; font-feature-settings:"tnum" 1;}
  a{color:inherit;}
  .wrap{max-width:900px; margin:0 auto;}

  .topbar{
    position:sticky; top:0; z-index:30;
    display:flex; align-items:center; gap:16px; flex-wrap:wrap;
    padding-block:16px;
    background:color-mix(in srgb, var(--paper) 92%, transparent);
    backdrop-filter:blur(8px);
    border-bottom:1px solid var(--line);
    margin-inline:-20px; padding-inline:20px;
  }
  .brand{display:flex; align-items:baseline; gap:10px; margin-right:auto;}
  .brand .mark{
    width:30px; height:30px; border-radius:50%;
    background:conic-gradient(from -40deg, var(--turf), var(--turf-deep) 55%, var(--turf) 100%);
    display:flex; align-items:center; justify-content:center;
    color:var(--surface); font-size:13px; font-weight:800; flex:none;
  }
  .brand h1{font-size:19px; font-weight:700; letter-spacing:.02em;}
  .page-nav{display:flex; gap:6px; background:var(--surface-2); padding:4px; border-radius:999px; border:1px solid var(--line-soft);}
  .page-nav a{
    text-decoration:none; cursor:pointer; font-family:inherit;
    padding:7px 15px; border-radius:999px; font-size:13.5px; font-weight:600;
    color:var(--ink-muted); display:inline-block;
  }
  .page-nav a.active{background:var(--turf); color:#fff;}
  .page-nav a:not(.active):hover{color:var(--ink);}

  .page-title{font-size:22px; font-weight:800; margin:26px 0 4px;}
  .page-desc{font-size:13.5px; color:var(--ink-muted); line-height:1.75; max-width:640px; margin-bottom:22px;}

  .stats-bar{
    padding:18px 20px;
    background:var(--surface); border:1px solid var(--line-soft); border-radius:var(--radius-md);
    box-shadow:var(--shadow);
  }
  .stats-bar .title{font-size:12px; font-weight:700; color:var(--ink-faint); letter-spacing:.06em; margin-bottom:12px;}
  .stats-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(120px,1fr)); gap:14px;}
  .stat{display:flex; flex-direction:column; gap:2px;}
  .stat .v{font-size:24px; font-weight:800; color:var(--turf-deep);}
  :root[data-theme="dark"] .stat .v, @media (prefers-color-scheme:dark){.stat .v{color:var(--turf);}}
  .stat .v.neg{color:var(--negative);}
  .stat .l{font-size:11px; color:var(--ink-faint);}

  .section-label{
    font-size:12px; font-weight:700; letter-spacing:.12em; color:var(--ink-faint);
    text-transform:uppercase; margin:34px 0 10px;
  }

  table.perf{width:100%; border-collapse:collapse; background:var(--surface); border:1px solid var(--line-soft); border-radius:var(--radius-md); overflow:hidden;}
  table.perf th, table.perf td{padding:11px 14px; text-align:right; font-size:13px; border-bottom:1px solid var(--line-soft);}
  table.perf th:first-child, table.perf td:first-child{text-align:left;}
  table.perf th{font-size:11px; color:var(--ink-faint); font-weight:700; letter-spacing:.04em; background:var(--surface-2);}
  table.perf tbody tr:last-child td{border-bottom:none;}
  table.perf td.neg{color:var(--negative);}
  table.perf td.date{font-weight:700; color:var(--ink);}
  .empty-note{font-size:13px; color:var(--ink-faint); padding:20px; text-align:center;}

  footer{margin:50px -20px 0; padding:20px; border-top:1px solid var(--line); font-size:11.5px; color:var(--ink-faint); text-align:center;}
</style>
</head>
<body>
  <div class="wrap">
    <div class="topbar">
      <div class="brand">
        <div class="mark">AI</div>
        <div>
          <h1 class="serif">総合指数ボード</h1>
        </div>
      </div>
      <div class="page-nav">
        <a href="./">指数ボード</a>
        <a href="seiseki.html" class="active">成績</a>
      </div>
    </div>

    <div class="page-title serif">成績</div>
    <div class="page-desc">日ごとの本命(総合指数1位)の的中率・回収率をまとめたページです。実際の着順が判明しているレースのみを集計対象にしています(重賞レースを含む)。</div>

    <div class="stats-bar">
      <div class="title">全期間合計</div>
      <div class="stats-grid"><div class="stat"><span class="v tnum">48</span><span class="l">対象レース</span></div>
<div class="stat"><span class="v tnum">12.5%</span><span class="l">単勝的中率</span></div>
<div class="stat"><span class="v tnum">37.5%</span><span class="l">複勝的中率</span></div>
<div class="stat"><span class="v tnum neg">45%</span><span class="l">単勝回収率</span></div>
<div class="stat"><span class="v tnum neg">72%</span><span class="l">複勝回収率</span></div></div>
    </div>

    <div class="section-label">日別成績</div>
    <table class="perf">
      <thead>
        <tr><th>日付</th><th>対象レース</th><th>単勝的中率</th><th>複勝的中率</th><th>単勝回収率</th><th>複勝回収率</th></tr>
      </thead>
      <tbody>
<tr><td class="date">2026年9月13日</td><td class="tnum">24</td><td class="tnum">12.5%</td><td class="tnum">41.7%</td><td class="tnum neg">53%</td><td class="tnum neg">99%</td></tr>
<tr><td class="date">2026年9月12日</td><td class="tnum">24</td><td class="tnum">12.5%</td><td class="tnum">33.3%</td><td class="tnum neg">36%</td><td class="tnum neg">46%</td></tr>
      </tbody>
    </table>

    <footer>総合指数ボード &middot; 成績ページ</footer>
  </div>
</body>
</html>
